[package]
name = "ex_monty"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"

[lib]
name = "ex_monty"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.37", features = ["big_integer"] }
# Pinned to the commit v1.6.0 points at. For local development against a
# monty checkout, swap the git deps for the path deps below.
monty = { git = "https://github.com/pydantic/monty.git", rev = "3f89dcbf82071896efb5e3ded507db4191e8d829" }
monty-types = { git = "https://github.com/pydantic/monty.git", rev = "3f89dcbf82071896efb5e3ded507db4191e8d829" }
monty-fs = { git = "https://github.com/pydantic/monty.git", rev = "3f89dcbf82071896efb5e3ded507db4191e8d829" }
# monty = { path = "../../../monty/crates/monty" }
# monty-types = { path = "../../../monty/crates/monty-types" }
# monty-fs = { path = "../../../monty/crates/monty-fs" }
num-bigint = "0.4"
# Same codec (and locked version) upstream uses for its session dumps.
minicbor-serde = { version = "0.7", default-features = false, features = ["alloc"] }
# Fresh instance ids for host objects (already in the tree via monty).
getrandom = "0.3"

serde = { version = "1.0", features = ["derive"] }
