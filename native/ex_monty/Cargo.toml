[package]
name = "ex_monty"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "ex_monty"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.37", features = ["big_integer"] }
# Pinned to the commit v0.0.21 points at. For local development against a
# monty checkout, swap the git deps for the path deps below.
monty = { git = "https://github.com/pydantic/monty.git", rev = "70fe3f5781381eb33579e45046f8cb3845953373" }
monty-types = { git = "https://github.com/pydantic/monty.git", rev = "70fe3f5781381eb33579e45046f8cb3845953373" }
monty-fs = { git = "https://github.com/pydantic/monty.git", rev = "70fe3f5781381eb33579e45046f8cb3845953373" }
# monty = { path = "../../../monty/crates/monty" }
# monty-types = { path = "../../../monty/crates/monty-types" }
# monty-fs = { path = "../../../monty/crates/monty-fs" }
num-bigint = "0.4"
postcard = { version = "1.1", features = ["alloc"] }

serde = { version = "1.0", features = ["derive"] }
